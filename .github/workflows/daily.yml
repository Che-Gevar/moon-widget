name: Update Moon Widget

on:
  schedule:
    - cron: "5 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update today.json
        run: python update.py

      - name: Commit changes
        run: |
          git config user.name "moon-widget-bot"
          git config user.email "moon-widget-bot@users.noreply.github.com"
          git add today.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update daily lunar forecast"
            git push
          fi